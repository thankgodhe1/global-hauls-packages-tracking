<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Shipments – 66 Global Haul Zone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* Professional font icons on dashboard */
    .action-card .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .action-card .icon i { line-height: 1; }
    .bottom-nav .nav-item .icon {
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 24px;
    }
    .bottom-nav .nav-item .icon i { line-height: 1; }
    .icon-btn i { font-size: 16px; }
    .search-box button i { font-size: 15px; }
    .empty-state .icon {
      font-size: 36px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .shipment-img.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #64748b;
      background: #f1f5f9;
    }
    .promo-card .promo-art i {
      font-size: 42px;
      opacity: 0.9;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="home-header">
      <div class="top-row">
        <div class="user-greeting">
          <div class="avatar" id="userAvatar">?</div>
          <div class="greeting-text">
            <div class="hello">Hello,</div>
            <div class="name" id="userName">Guest</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" title="Logout" onclick="clearSession()"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>

      <h1 class="hero-title">Your Shipments</h1>
      <p class="hero-subtitle">Track, manage and follow all your packages</p>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter another tracking number" autocomplete="off">
        <button id="searchBtn" type="button" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
    </header>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <div class="action-card" style="cursor:default;opacity:0.85;">
        <div class="icon blue"><i class="fa-solid fa-box"></i></div>
        <div class="label">Send Parcel</div>
      </div>
      <div class="action-card" onclick="document.getElementById('searchInput').focus()">
        <div class="icon orange"><i class="fa-solid fa-location-dot"></i></div>
        <div class="label">Track Parcel</div>
      </div>
      <div class="action-card" style="cursor:default;opacity:0.85;">
        <div class="icon green"><i class="fa-solid fa-file-invoice-dollar"></i></div>
        <div class="label">Get a Quote</div>
      </div>
      <div class="action-card" style="cursor:default;opacity:0.85;">
        <div class="icon purple"><i class="fa-solid fa-house"></i></div>
        <div class="label">Home</div>
      </div>
    </div>

    <!-- Active Shipments (dynamic only) -->
    <section class="section">
      <div class="section-header">
        <h2>Active Shipments</h2>
      </div>
      <div class="shipment-list" id="shipmentList">
        <div class="empty-state" style="padding:32px 16px;">
          <div class="icon"><i class="fa-solid fa-box-open"></i></div>
          <h3>Loading your shipments...</h3>
        </div>
      </div>
    </section>

    <!-- Promo -->
    <div class="promo-banner">
      <div class="text">
        <h3>Send Worldwide</h3>
        <p>Affordable rates to over 220 countries</p>
        <button class="btn-promo" type="button" style="cursor:default;">Get Started</button>
      </div>
      <div class="illustration"><i class="fa-solid fa-plane"></i><i class="fa-solid fa-earth-americas"></i></div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <div class="nav-item active">
        <span class="icon"><i class="fa-solid fa-house"></i></span>
        <span>Home</span>
      </div>
      <div class="nav-item">
        <span class="icon"><i class="fa-solid fa-location-dot"></i></span>
        <span>Track</span>
      </div>
      <div class="nav-item" style="cursor:default;opacity:0.7;">
        <span class="icon"><i class="fa-solid fa-box"></i></span>
        <span>Send</span>
      </div>
      <div class="nav-item" style="cursor:default;opacity:0.7;">
        <span class="icon"><i class="fa-solid fa-file-invoice-dollar"></i></span>
        <span>Quote</span>
      </div>
      <div class="nav-item" onclick="clearSession()" title="Logout">
        <span class="icon"><i class="fa-solid fa-right-from-bracket"></i></span>
        <span>Logout</span>
      </div>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    // ========== ACCESS CONTROL ==========
    // User can only see this page if they have a valid session from a tracking lookup
    function getUserContext() {
      try {
        const raw = sessionStorage.getItem('deliveryUser');
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    const ctx = getUserContext();
    if (!ctx || !ctx.email || !ctx.name) {
      // No valid session → force back to landing page
      window.location.replace('index.html');
      throw new Error('Unauthorized – redirecting to landing page');
    }

    // ========== RENDER ==========
    document.getElementById('userName').textContent = ctx.name;
    document.getElementById('userAvatar').textContent = (ctx.name || '?').charAt(0).toUpperCase();

    function renderShipments(shipments) {
      const list = document.getElementById('shipmentList');

      if (!shipments || shipments.length === 0) {
        list.innerHTML = `
          <div class="empty-state" style="padding:32px 16px;">
            <div class="icon"><i class="fa-solid fa-box-open"></i></div>
            <h3>No active shipments</h3>
            <p style="font-size:13px;margin-top:6px;">We could not find shipments for this account</p>
          </div>`;
        return;
      }

      list.innerHTML = shipments.map(t => {
        const img = t.product?.image
          ? `<img src="${t.product.image}" class="shipment-img" alt="">`
          : `<div class="shipment-img placeholder"><i class="fa-solid fa-box"></i></div>`;

        return `
          <div class="shipment-card" onclick="goToTrack('${t.trackingNumber}')">
            ${img}
            <div class="shipment-info">
              <div class="tn">#${t.trackingNumber}</div>
              <div class="product">${escapeHtml(t.product?.name || 'Package')}</div>
              <div class="route">${escapeHtml(t.origin?.name || '')} → ${escapeHtml(t.destination?.name || '')}</div>
            </div>
            <div class="shipment-status">
              <span class="badge ${getStatusClass(t.status)}">${t.status}</span>
            </div>
          </div>`;
      }).join('');
    }

    // Initial render from session
    renderShipments(ctx.shipments || []);

    // Refresh from server so data is always up to date
    api.getCustomerShipments(ctx.email)
      .then(res => {
        if (res.success && res.data) {
          const updated = {
            name: ctx.name,
            email: ctx.email,
            phone: ctx.phone || '',
            shipments: res.data,
            lastTracking: ctx.lastTracking
          };
          sessionStorage.setItem('deliveryUser', JSON.stringify(updated));
          renderShipments(res.data);
        }
      })
      .catch(() => {});

    // ========== SEARCH ANOTHER TRACKING ==========
    async function doSearch() {
      const tn = document.getElementById('searchInput').value.trim().toUpperCase();
      if (!tn) {
        showToast('Please enter a tracking number');
        return;
      }

      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      btn.innerHTML = '…';

      try {
        const res = await api.lookup(tn);
        if (!res.success || !res.data) {
          showToast(res.message || 'Tracking not found');
          return;
        }

        const { customer, shipments, current } = res.data;
        sessionStorage.setItem('deliveryUser', JSON.stringify({
          name: customer.name,
          email: customer.email,
          phone: customer.phone || '',
          shipments: shipments || [],
          lastTracking: current.trackingNumber
        }));

        // Update UI for the new customer
        document.getElementById('userName').textContent = customer.name;
        document.getElementById('userAvatar').textContent = (customer.name || '?').charAt(0).toUpperCase();
        renderShipments(shipments);
        showToast(`Showing shipments for ${customer.name}`);
      } catch (err) {
        showToast(err.message || 'Tracking not found');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i>';
      }
    }

    document.getElementById('searchBtn').addEventListener('click', doSearch);
    document.getElementById('searchInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doSearch();
    });

    function goToTrack(tn) {
      window.location.href = `track.html?tn=${encodeURIComponent(tn)}`;
    }

    function clearSession() {
      sessionStorage.removeItem('deliveryUser');
      window.location.href = 'index.html';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
